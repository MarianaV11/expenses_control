version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    image: mariana1020/expenses_backend:v1.0.0
    container_name: expenses_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    image: mariana1020/expenses_frontend:v1.0.0
    container_name: expenses_frontend
    restart: unless-stopped
    command: npm start
    depends_on:
      - backend

  db:
    image: postgres:13
    container_name: expenses_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expenses_control
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d expenses_control"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
