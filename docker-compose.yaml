version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    image: mariana1020/expenses_backend:v1.0.0
    container_name: expenses_backend
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    image: mariana1020/expenses_frontend:v1.0.0
    container_name: expenses_frontend
    command: npm start
    depends_on:
      - backend

  db:
    image: postgres:13
    container_name: expenses_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expenses_control
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
